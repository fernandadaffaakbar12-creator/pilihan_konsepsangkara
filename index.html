<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilihan Konsep Sangkara</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>✨ Pilihan Konsep Sangkara ✨</h1>
        <p>Kumpulan ide dan hasil foto yang seru dan realistic!</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-category="semua">🌟 Semua</button>
        <button class="filter-btn" data-category="terbaru">🔥 Terbaru</button>
        <button class="filter-btn" data-category="pasangan">👫 Pasangan/random</button>
        <button class="filter-btn" data-category="pria">👨 Pria</button>
        <button class="filter-btn" data-category="wanita">👩 Wanita</button>
    </div>

    <main id="gallery-container" class="gallery"></main>

    <!-- Modal Popup Preview Gambar & Kirim Konsep -->
    <div id="image-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button id="modal-close" class="modal-close-btn" aria-label="Tutup preview">&times;</button>
            <div class="modal-image-wrapper">
                <img id="modal-img" src="" alt="Preview Konsep">
            </div>
            <div class="modal-body">
                <div class="modal-compliment">✨ Pilihan yang bagus! ✨</div>
                <h3 id="modal-title" class="modal-title"></h3>
                <a id="modal-wa-btn" class="modal-wa-btn" href="#" target="_blank" rel="noopener noreferrer">
                    <!-- Icon WhatsApp SVG -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">

                    <span>Kirim konsep ke mimin</span>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
